<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="SANA - Health Management Application">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sana">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SANA</title>
  <link rel="manifest" href="manifest.json">

  <script>
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      window.__sanaPwaPrompt = e;
    });
    window.addEventListener("appinstalled", function () {
      window.__sanaPwaPrompt = null;
      window.__sanaPwaInstalled = true;
    });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Register the SANA service worker for Web Push.
    // There is no other service worker in this project, so there is
    // no conflict with Flutter's web bootstrap.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sana_sw.js', { scope: '/sana/' })
          .catch((e) => console.warn('SANA SW registration failed:', e));
      });
    }
  </script>
</body>
</html>
