name: Build SANA iOS - Cloud Validation

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_16*.app' | sort -V | tail -n 1)"
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure iOS Pods
        run: |
          flutter build ios --config-only --no-codesign
          cd ios
          pod install

      - name: Build iOS
        id: build_step
        run: |
          set -o pipefail
          flutter build ios --simulator --no-codesign --verbose 2>&1 | tee build_output.log

      - name: Capture Failure Diagnostics
        if: failure()
        run: |
          echo "### iOS Build Failure Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -C 5 -i -E "(error:|BUILD FAILED|The following build commands failed)" build_output.log | head -n 80 >> $GITHUB_STEP_SUMMARY || tail -n 60 build_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload iOS Runner Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SANA-iOS-Runner
          path: build/ios/iphonesimulator/Runner.app
