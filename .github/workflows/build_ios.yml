name: Build SANA iOS - Cloud Validation

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_16*.app' | sort -V | tail -n 1)"
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pin iOS plugin versions for compatibility test
        run: |
          echo "dependency_overrides:" >> pubspec.yaml
          echo "  workmanager_apple: 0.9.4" >> pubspec.yaml
          echo "  connectivity_plus: 6.1.5" >> pubspec.yaml

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure iOS Pods
        run: |
          flutter build ios --config-only --no-codesign
          cd ios
          pod install

      - name: Build iOS Simulator
        run: flutter build ios --simulator --no-codesign --verbose

      - name: Upload iOS Runner Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SANA-iOS-Runner
          path: build/ios/iphonesimulator/Runner.app
