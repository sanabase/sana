name: Build SANA iOS - Cloud Validation

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_16*.app' | sort -V | tail -n 1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "Xcode 16 was not found."
            ls -1 /Applications | grep -i '^Xcode' || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure iOS Pods
        run: |
          flutter build ios --config-only --no-codesign
          cd ios
          pod install

      - name: Build iOS
        run: flutter build ios --simulator --no-codesign --verbose

      - name: Upload iOS Runner Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SANA-iOS-Runner
          path: build/ios/iphonesimulator/Runner.app
