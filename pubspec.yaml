name: sana
description: AI Medical Records & Smart Medication Reminder
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  country_codes: ^3.0.0

  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.9.1

  # State Management
  provider: ^6.1.5

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  sqflite: ^2.4.1
  path: ^1.9.1

  # Preferences
  shared_preferences: ^2.5.3

  # Notifications & Alarms
  flutter_local_notifications: 22.2.0
  timezone: 0.11.1
  flutter_timezone: ^4.1.1

  # Background tasks
  workmanager: ^0.9.0

  # Images
  image_picker: ^1.2.0
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0

  # Files
  file_picker: ^10.3.2
  open_filex: ^4.7.0

  # Camera
  camera: ^0.11.2

  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1

  # Charts
  fl_chart: ^1.1.1

  # Calendar
  table_calendar: ^3.2.0

  # Date & Time
  intl: ^0.20.2

  # Sharing
  share_plus: ^11.1.0

  # URLs
  url_launcher: ^6.3.2

  # Connectivity
  connectivity_plus: ^7.0.0

  # Internet images
  http: ^1.6.0

  # AI Translation
  translator: ^1.0.3

  # Voice
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.3

  # PDF
  pdf: ^3.11.3
  printing: ^5.14.2

  # UUID
  uuid: ^4.6.0

  # Permissions
  permission_handler: 12.0.3

  # Device information
  device_info_plus: ^11.0.0

  # Icons
  font_awesome_flutter: ^10.10.0

  # Animations
  lottie: ^3.3.2
  go_router: ^17.5.0
  web: 1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: 2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
